name: CI/CD Pipeline

on:
  push:
    branches: [master]

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mentorman

jobs:
  # ── 1. Build the multi-stage image and push to Docker Hub ─────────────────
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ env.IMAGE }}:${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          # Context is repo root so the Dockerfile can COPY from both
          # mentorman-web/ and unified-backend/ in a single build.
          context: .
          file: unified-backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Pull the new image on EC2 and restart the container ────────────────
  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          # Pass only the image tag; all secrets are fetched from SSM on the EC2
          # host using its IAM instance role — nothing sensitive travels over SSH.
          envs: IMAGE_TAG
          script: |
            set -euo pipefail
            IMAGE_TAG="${{ env.IMAGE }}:${{ github.sha }}"

            echo "==> Pulling $IMAGE_TAG"
            docker pull "$IMAGE_TAG"

            echo "==> Fetching secrets from SSM"
            fetch() {
              aws ssm get-parameter --name "$1" --with-decryption \
                --query Parameter.Value --output text --region us-east-1
            }
            MONGODB_URI=$(fetch /mentorman/mongodb-uri)
            ANTHROPIC_API_KEY=$(fetch /claude-proxy/anthropic-api-key)
            VOYAGE_API_KEY=$(fetch /voyageapikey)

            # Optional: Clerk issuer for JWT verification (skip if not set)
            CLERK_ISSUER=$(fetch /mentorman/clerk-issuer 2>/dev/null || true)

            echo "==> Replacing container"
            docker stop mentorman 2>/dev/null || true
            docker rm   mentorman 2>/dev/null || true

            docker run -d \
              --name mentorman \
              --restart unless-stopped \
              -p 3000:8000 \
              -e MONGODB_URI="$MONGODB_URI" \
              -e ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
              -e VOYAGE_API_KEY="$VOYAGE_API_KEY" \
              ${CLERK_ISSUER:+-e CLERK_ISSUER="$CLERK_ISSUER"} \
              "$IMAGE_TAG"

            echo "==> Health check"
            for i in $(seq 1 10); do
              if docker exec mentorman python -c "import httpx; httpx.get('http://127.0.0.1:8000/health').raise_for_status()" 2>/dev/null; then
                echo "Healthy after ${i} attempt(s)"
                break
              fi
              if [ "$i" -eq 10 ]; then
                echo "Health check failed after 10 attempts — last container logs:"
                docker logs --tail 50 mentorman
                exit 1
              fi
              sleep 3
            done

            echo "==> Pruning old images"
            docker image prune -a -f --filter "until=24h"

            echo "==> Deploy complete"
