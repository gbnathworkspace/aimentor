<title>AI Mentor — full system flow</title>
<desc>End-to-end architecture: user flows through Next.js frontend into FastAPI backend, three-layer memory (MongoDB L1/L2 + Atlas Vector L3), Claude Sonnet for main reasoning, Haiku for lightweight calls, and daily cron alerts via Lambda.</desc>

