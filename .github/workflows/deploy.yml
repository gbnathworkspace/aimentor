name: CI/CD Pipeline

on:
  push:
    branches: [master]

jobs:
  # Build on Fly's remote builder and roll the single machine. Config is in
  # fly.toml; runtime secrets live in `fly secrets`, not in GitHub.
  deploy:
    name: Deploy to Fly
    runs-on: ubuntu-latest
    concurrency: deploy-group

    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
