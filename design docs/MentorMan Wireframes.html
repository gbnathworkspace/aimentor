<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MentorMan — Wireframes</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #09090b;          /* zinc-950 */
    --panel: #0f0f12;
    --card: #18181b;        /* zinc-900 */
    --card-2: #1f1f23;
    --border: #27272a;      /* zinc-800 */
    --border-soft: #1f1f23;
    --muted: #71717a;       /* zinc-500 */
    --muted-2: #a1a1aa;     /* zinc-400 */
    --fg: #fafafa;          /* zinc-50 */
    --fg-dim: #e4e4e7;      /* zinc-200 */
    --accent: #34d399;      /* emerald-400 */
    --accent-dim: #064e3b;
    --warn: #fbbf24;        /* amber-400 */
    --info: #60a5fa;        /* blue-400 */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  /* ----------- Page scaffold ----------- */
  .page {
    max-width: 1280px;
    margin: 0 auto;
    padding: 56px 48px 120px;
  }
  .doc-header {
    display: flex; justify-content: space-between; align-items: flex-end;
    padding-bottom: 24px;
    border-bottom: 1px dashed var(--border);
    margin-bottom: 56px;
  }
  .doc-header h1 {
    margin: 0;
    font-size: 22px; font-weight: 600; letter-spacing: -0.01em;
  }
  .doc-header .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .screen-block { margin-bottom: 96px; }
  .screen-label {
    display: flex; align-items: baseline; gap: 16px;
    margin-bottom: 20px;
  }
  .screen-label .num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: var(--muted);
    letter-spacing: 0.1em; text-transform: uppercase;
  }
  .screen-label .title {
    font-size: 14px; font-weight: 500; color: var(--fg-dim);
  }
  .screen-label .desc {
    font-size: 12px; color: var(--muted); margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
  }

  .frame {
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--bg);
    overflow: hidden;
    position: relative;
  }
  .frame-chrome {
    height: 28px;
    background: #050507;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 12px; gap: 6px;
  }
  .frame-chrome .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--border);
  }
  .frame-chrome .url {
    margin-left: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--muted);
  }

  /* ----------- Shared shadcn-ish bits ----------- */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    height: 32px; padding: 0 12px;
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--fg-dim);
    font-size: 13px; font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  .btn:hover { background: #2a2a2f; }
  .btn-primary {
    background: var(--fg); color: #09090b; border-color: var(--fg);
  }
  .btn-ghost {
    background: transparent; border-color: transparent;
  }
  .btn-icon {
    width: 28px; height: 28px; padding: 0; justify-content: center;
  }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    height: 22px; padding: 0 8px;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--muted-2);
    letter-spacing: 0.04em;
  }
  .pill .ind {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted);
  }
  .pill.active { color: var(--accent); border-color: rgba(52,211,153,0.3); background: rgba(52,211,153,0.06); }
  .pill.active .ind { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .pill.warn { color: var(--warn); border-color: rgba(251,191,36,0.3); background: rgba(251,191,36,0.05);}
  .pill.warn .ind { background: var(--warn); }
  .pill.info { color: var(--info); border-color: rgba(96,165,250,0.3); background: rgba(96,165,250,0.05);}
  .pill.info .ind { background: var(--info); }

  .tag {
    display: inline-block;
    padding: 1px 6px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--muted-2);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* ----------- Screen 1 — Onboarding ----------- */
  .s1 {
    height: 720px;
    display: flex; flex-direction: column;
    background: var(--bg);
  }
  .s1-top {
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 24px;
    border-bottom: 1px dashed var(--border-soft);
  }
  .s1-brand {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; font-weight: 600; letter-spacing: -0.01em;
  }
  .brand-mark {
    width: 24px; height: 24px;
    border: 1px solid var(--fg);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; font-weight: 700;
  }
  .s1-step {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: var(--muted);
  }
  .s1-stage {
    flex: 1;
    display: flex; flex-direction: column;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    padding: 48px 24px 24px;
    gap: 20px;
    overflow-y: auto;
    min-height: 0;
  }
  .bubble {
    max-width: 78%;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.55;
  }
  .bubble.mentor {
    background: var(--card);
    border: 1px solid var(--border);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .bubble.user {
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--fg-dim);
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .bubble .who {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  .dropzone {
    align-self: flex-start;
    width: 78%;
    margin-top: 4px;
    border: 1.5px dashed var(--border);
    border-radius: 12px;
    padding: 22px 20px;
    display: flex; align-items: center; gap: 16px;
    background: rgba(255,255,255,0.01);
  }
  .dropzone .ico {
    width: 36px; height: 36px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
  }
  .dropzone .copy { flex: 1; }
  .dropzone .copy .t { font-size: 13px; color: var(--fg-dim); margin-bottom: 2px; }
  .dropzone .copy .s { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
  .dropzone .files {
    display: flex; gap: 6px;
  }
  .file-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--muted-2);
    background: var(--card);
  }
  .file-chip .ok { color: var(--accent); }

  .s1-input {
    margin: auto 24px 28px;
    max-width: 720px;
    width: calc(100% - 48px);
    align-self: center;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
  }
  .s1-input .ph { flex: 1; font-size: 13px; color: var(--muted); }
  .s1-input .send {
    width: 28px; height: 28px;
    border-radius: 6px;
    background: var(--card-2);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    color: var(--muted-2); font-size: 13px;
  }

  /* ----------- Screen 2 / 3 — Main chat ----------- */
  .s2 {
    height: 760px;
    display: flex;
  }
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    background: var(--panel);
    display: flex; flex-direction: column;
  }
  .sidebar-head {
    padding: 16px 14px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px dashed var(--border-soft);
  }
  .sidebar-head .brand {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 600;
  }
  .sidebar-head .brand .brand-mark { width: 20px; height: 20px; font-size: 10px; }
  .new-session {
    margin: 12px;
    height: 36px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 12px; color: var(--fg-dim); font-weight: 500;
    cursor: pointer;
    background: rgba(255,255,255,0.01);
  }
  .new-session:hover { background: rgba(255,255,255,0.03); }
  .new-session .plus {
    width: 16px; height: 16px; border: 1px solid var(--muted); border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--muted);
  }

  .sidebar-section {
    padding: 12px 14px 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase;
  }
  .session-list { padding: 0 8px; overflow-y: auto; flex: 1; }
  .session {
    padding: 10px 10px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid transparent;
    margin-bottom: 2px;
  }
  .session:hover { background: var(--card); }
  .session.active {
    background: var(--card);
    border-color: var(--border);
  }
  .session .row1 {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 6px;
  }
  .session .title {
    font-size: 12px; color: var(--fg-dim); font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 170px;
  }
  .session .date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; color: var(--muted);
  }
  .session .row2 { display: flex; gap: 4px; align-items: center; }

  .sidebar-foot {
    border-top: 1px dashed var(--border-soft);
    padding: 12px 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .avatar {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 1px dashed var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: var(--muted);
  }
  .sidebar-foot .who {
    font-size: 12px; color: var(--fg-dim);
  }
  .sidebar-foot .sub {
    font-size: 10px; color: var(--muted); font-family: 'JetBrains Mono', monospace;
  }

  /* Right panel */
  .chat-panel {
    flex: 1;
    display: flex; flex-direction: column;
    background: var(--bg);
    min-width: 0;
  }
  .chat-head {
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
    flex-wrap: wrap;
    row-gap: 10px;
    min-width: 0;
  }
  .chat-head .title {
    font-size: 13px; font-weight: 500; color: var(--fg-dim);
    flex: 0 1 240px;
    min-width: 140px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .chat-head .modes { flex-shrink: 0; }
  .pill, .ro-badge { white-space: nowrap; }
  .chat-head .modes {
    display: flex; gap: 4px; align-items: center;
    padding: 3px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--card);
  }
  .mode-tab {
    padding: 4px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    border-radius: 999px;
    color: var(--muted);
    letter-spacing: 0.04em;
    cursor: pointer;
  }
  .mode-tab.active {
    background: var(--card-2);
    color: var(--accent);
    border: 1px solid rgba(52,211,153,0.3);
    box-shadow: 0 0 0 1px rgba(52,211,153,0.1);
  }
  .chat-head-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }

  .ro-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px;
    border: 1px dashed var(--border);
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted-2);
    letter-spacing: 0.04em;
  }
  .ro-badge .lock { font-family: 'JetBrains Mono', monospace; }

  .chat-body {
    flex: 1;
    overflow-y: auto;
    padding: 32px 0;
  }
  .chat-inner {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex; flex-direction: column; gap: 20px;
  }

  .nudge {
    margin-top: 10px;
    border-left: 2px solid var(--accent);
    padding: 8px 12px;
    background: rgba(52,211,153,0.04);
    border-radius: 4px;
    font-size: 12px; color: var(--fg-dim);
  }
  .nudge .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--accent);
    text-transform: uppercase; letter-spacing: 0.1em;
    margin-bottom: 4px;
  }

  .codeblock {
    margin-top: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #050507;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted-2);
    padding: 12px 14px;
    line-height: 1.6;
  }
  .codeblock .com { color: var(--muted); }
  .codeblock .kw { color: var(--info); }

  .chat-input {
    padding: 16px 24px 20px;
    border-top: 1px solid var(--border);
  }
  .chat-input-box {
    max-width: 720px;
    margin: 0 auto;
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 10px;
    padding: 12px 12px 8px;
  }
  .chat-input-box .ph { font-size: 13px; color: var(--muted); padding: 4px 4px 16px; }
  .chat-input-box .tools {
    display: flex; align-items: center; gap: 6px;
  }
  .chat-input-box .tools .spacer { flex: 1; }
  .icon-btn {
    width: 26px; height: 26px;
    border-radius: 6px;
    border: 1px solid var(--border-soft);
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--muted);
    cursor: pointer;
  }

  .ro-overlay {
    padding: 16px 24px;
    text-align: center;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    border-top: 1px dashed var(--border);
    background: rgba(255,255,255,0.01);
  }

  /* Hint card */
  .hint {
    margin-top: 16px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    background: rgba(255,255,255,0.02);
    text-align: center;
  }
  .hint .kbd {
    display: inline-block; padding: 1px 6px;
    border: 1px solid var(--border); border-radius: 4px;
    color: var(--fg-dim);
    background: var(--card);
    margin: 0 2px;
  }

  /* ----------- Screen 4 — Email ----------- */
  .email-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }
  .email-frame {
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: #fafafa;
    color: #18181b;
    display: flex; flex-direction: column;
  }
  .email-chrome {
    background: #ececec;
    padding: 10px 14px;
    border-bottom: 1px solid #d4d4d4;
    display: flex; align-items: center; gap: 8px;
  }
  .email-chrome .dot { width: 8px; height: 8px; border-radius: 50%; background: #c4c4c4;}
  .email-chrome .lbl {
    margin-left: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: #71717a;
  }
  .email-meta {
    padding: 14px 20px 10px;
    border-bottom: 1px solid #e4e4e7;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: #71717a;
    line-height: 1.7;
  }
  .email-meta b { color: #18181b; font-weight: 600; }
  .email-body {
    padding: 28px 24px 24px;
    flex: 1;
    display: flex; flex-direction: column;
  }
  .email-brand {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 24px;
  }
  .email-brand .mark {
    width: 22px; height: 22px; border-radius: 5px;
    border: 1px solid #18181b;
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; font-weight: 700;
  }
  .email-brand .name { font-size: 12px; font-weight: 600; }

  .email-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .email-tag.warn { background: #fef3c7; color: #92400e; }
  .email-tag.info { background: #dbeafe; color: #1e40af; }
  .email-tag.good { background: #d1fae5; color: #065f46; }

  .email-h {
    font-size: 20px;
    line-height: 1.3;
    font-weight: 600;
    margin: 0 0 14px;
    letter-spacing: -0.01em;
  }
  .email-p {
    font-size: 13px;
    line-height: 1.65;
    color: #3f3f46;
    margin: 0 0 14px;
  }
  .email-stat {
    display: flex; gap: 16px;
    margin: 16px 0;
    padding: 14px;
    border: 1px solid #e4e4e7;
    border-radius: 8px;
    background: #fff;
  }
  .email-stat .item { flex: 1; }
  .email-stat .item .v {
    font-size: 18px; font-weight: 600; font-family: 'JetBrains Mono', monospace;
    color: #18181b;
  }
  .email-stat .item .l {
    font-size: 10px;
    color: #71717a;
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 2px;
  }
  .email-cta {
    display: inline-block;
    padding: 10px 16px;
    background: #18181b;
    color: #fafafa;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    text-decoration: none;
    margin-top: 6px;
    align-self: flex-start;
  }
  .email-cta.ghost {
    background: transparent;
    color: #18181b;
    border: 1px solid #d4d4d4;
  }
  .email-foot {
    margin-top: auto;
    padding-top: 20px;
    border-top: 1px dashed #d4d4d4;
    font-size: 10px;
    color: #a1a1aa;
    font-family: 'JetBrains Mono', monospace;
    display: flex; justify-content: space-between;
  }

  /* small annotation arrows */
  .annot {
    position: absolute;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    pointer-events: none;
  }

  /* ----------- Sidebar — new session row w/ chart icon ----------- */
  .sidebar-actions {
    display: flex; align-items: stretch; gap: 8px;
    margin: 12px;
  }
  .sidebar-actions .new-session { margin: 0; flex: 1; }
  .sidebar-actions .nav-icon {
    width: 36px; height: 36px; flex-shrink: 0;
    border: 1px dashed var(--border);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.01);
    color: var(--muted-2);
    cursor: pointer;
  }
  .sidebar-actions .nav-icon:hover { background: rgba(255,255,255,0.03); color: var(--fg-dim); }
  .sidebar-actions .nav-icon.active {
    border-style: solid;
    border-color: rgba(52,211,153,0.3);
    background: rgba(52,211,153,0.06);
    color: var(--accent);
  }
  .nav-icon svg { width: 16px; height: 16px; }

  /* ----------- Screen 5 — Skill Graph Dashboard ----------- */
  .dash-panel {
    flex: 1;
    display: flex; flex-direction: column;
    background: var(--bg);
    min-width: 0;
    overflow-y: auto;
  }
  .dash-head {
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; gap: 16px;
    flex-wrap: wrap;
    row-gap: 12px;
  }
  .dash-head .left { flex: 1; min-width: 200px; }
  .dash-head .h {

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState } = React;

// ------------ Data ---------------
const SESSIONS = [
  { id: 's1', title: 'Graphs — BFS/DFS warmups', tag: 'DSA', date: 'today', active: true, live: true },
  { id: 's2', title: 'IAM roles for cross-account access', tag: 'AWS', date: 'yesterday' },
  { id: 's3', title: 'Topological sort: real interview qs', tag: 'DSA', date: '2d' },
  { id: 's4', title: 'Plan: 6-week FAANG ramp', tag: 'Planning', date: '3d' },
  { id: 's5', title: 'Why does my DP solution TLE?', tag: 'Doubt', date: '5d' },
  { id: 's6', title: 'S3 vs EFS for ML training', tag: 'AWS', date: '1w' },
  { id: 's7', title: 'Weekly evaluation — week 2', tag: 'Eval', date: '1w' },
  { id: 's8', title: 'Dijkstra on weighted DAGs', tag: 'DSA', date: '2w' },
];

const MODES = ['Planning', 'Topic', 'Doubt', 'Evaluation'];

// ------------ Reusable bits ---------------
const Brand = ({ small }) => (
  <div className="s1-brand">
    <div className="brand-mark" style={small ? { width: 20, height: 20, fontSize: 10 } : {}}>M</div>
    <span>MentorMan</span>
  </div>
);

const Bubble = ({ who, children, nudge }) => (
  <div className={`bubble ${who}`}>
    <div className="who">{who === 'mentor' ? 'Mentor' : 'You'}</div>
    {children}
    {nudge && (
      <div className="nudge">
        <div className="label">Nudge</div>
        {nudge}
      </div>
    )}
  </div>
);

// ------------ Screen 1 — Onboarding ---------------
const Screen1 = () => (
  <div className="frame">
    <div className="frame-chrome">
      <div className="dot" /><div className="dot" /><div className="dot" />
      <div className="url">mentorman.app / onboarding</div>
    </div>
    <div className="s1">
      <div className="s1-top">
        <Brand />
        <div className="s1-step">Step 1 of 1 · Just chat</div>
      </div>

      <div className="s1-stage">
        <Bubble who="mentor">
          <div style={{ fontSize: 16, lineHeight: 1.4 }}>What are you working towards?</div>
        </Bubble>

        <Bubble who="user">
          Cracking a FAANG-level SWE role in the next 3 months. ~180 LeetCode solved — graphs and DP feel shakiest. Last mock I bombed a traversal.
        </Bubble>

        <Bubble who="mentor">
          Got it. Drop your resume and LeetCode export if you have them — I'll calibrate from there. Skip if you'd rather not.
        </Bubble>

        <div className="dropzone">
          <div className="ico">↓</div>
          <div className="copy">
            <div className="t">Drop files here or click to upload</div>
            <div className="s">resume.pdf · leetcode_export.csv · optional</div>
          </div>
          <div className="files">
            <div className="file-chip"><span>resume.pdf</span><span className="ok">✓</span></div>
          </div>
        </div>
      </div>

      <div className="s1-input">
        <div className="icon-btn">+</div>
        <div className="ph">Type a reply…</div>
        <div className="send">→</div>
      </div>
    </div>
  </div>
);

// ------------ Sidebar (shared by Screens 2 & 3 & 5 & 6) ---------------
const Sidebar = ({ activeId, onPick, dashActive }) => (
  <div className="sidebar">
    <div className="sidebar-head">
      <Brand small />
      <div className="icon-btn" title="Settings">⚙</div>
    </div>
    <div className="sidebar-actions">
      <div className="new-session">
        <div className="plus">+</div>
        <span>New Session</span>
      </div>
      <div className={`nav-icon ${dashActive ? 'active' : ''}`} title="Skill graph">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
          <path d="M2 13 L2 3 M2 13 L14 13" />
          <rect x="4" y="8" width="2" height="4" />
          <rect x="7.5" y="5" width="2" height="7" />
          <rect x="11" y="9" width="2" height="3" />
        </svg>
      </div>
    </div>
    <div className="sidebar-section">Sessions</div>
    <div className="session-list">
      {SESSIONS.map(s => (
        <div
          key={s.id}
          className={`session ${activeId === s.id ? 'active' : ''}`}
          onClick={() => onPick(s.id)}
        >
          <div className="row1">
            <div className="title">{s.title}</div>
            <div className="date">{s.date}</div>
          </div>
          <div className="row2">
            <span className="tag">{s.tag}</span>
            {s.live && <span className="tag" style={{ color: 'var(--accent)', borderColor: 'rgba(52,211,153,0.3)' }}>● live</span>}
          </div>
        </div>
      ))}
    </div>
    <div className="sidebar-foot">
      <div className="avatar">A</div>
      <div>
        <div className="who">arjun.k</div>
        <div className="sub">free plan</div>
      </div>
    </div>
  </div>
);

// ------------ Chat panel (live OR read-only) ---------------
const ChatPanel = ({ session, readonly }) => {
  const isPast = readonly;
  return (
    <div className="chat-panel">
      <div className="chat-head">
        <div className="title">{session.title}</div>
        <div className="chat-head-right">
          {isPast ? (
            <span className="ro-badge"><span className="lock">⌗</span> read-only · archived</span>
          ) : (
            <span className="pill active"><span className="ind" /> session active</span>
          )}
          <div className="icon-btn">⋯</div>
        </div>
      </div>

      <div className="chat-body">
        <div className="chat-inner">
          {!isPast && (
            <>
              <Bubble who="mentor">
                Picking up from yesterday — you said BFS still feels rote. Let's do one warmup and then I want to throw a variant at you.
              </Bubble>
              <Bubble who="user">
                ok hit me
              </Bubble>
              <Bubble who="mentor">
                Classic: shortest path in an unweighted grid with walls. Write the function signature first, then talk through your queue invariant. Don't code yet.
              </Bubble>
              <Bubble who="user">
                <div style={{ marginBottom: 4 }}>def shortest(grid, start, end):</div>
                <div style={{ color: 'var(--muted-2)', fontSize: 13 }}>queue holds (row, col, dist). visited set is keyed on (row,col). pop, check end, expand 4 dirs if in bounds and not wall and not visited…</div>
              </Bubble>
              <Bubble who="mentor">
                Good. One thing — you said "dist" lives on the tuple. Could the visited set carry it instead? Why might that matter for a follow-up where edges have variable cost?
              </Bubble>
              <Bubble who="user">
                hmm. actually I'm curious — what's the difference between BFS and Dijkstra under the hood again
              </Bubble>
              <Bubble who="mentor" nudge="You've moved away from graphs — want to get back on track? You can pin this Dijkstra question for the Topic session tomorrow.">
                Quick answer: BFS = unweighted, queue is FIFO; Dijkstra = weighted, "queue" is a min-heap so you always expand the cheapest frontier. But —
              </Bubble>
              <Bubble who="user">
                yeah good call. back to the variant.
              </Bubble>
            </>
          )}

          {isPast && (
            <>
              <Bubble who="mentor">
                You wanted to understand IAM roles for cross-account S3 access. Let me walk you through it before you implement.
              </Bubble>
              <Bubble who="user">
                yes please. i keep getting AccessDenied even though my policy looks right
              </Bubble>
              <Bubble who="mentor">
                Two things have to align: (1) the trust policy on the role in Account B says Account A can assume it, and (2) the permissions policy on that role grants S3 actions. Most people get (1) right and (2) wrong, or vice versa.
              </Bubble>
              <Bubble who="user">
                <div className="codeblock">
                  <div><span className="com"># role-trust.json (Account B)</span></div>
                  <div>{`{ "Effect": "Allow",`}</div>
                  <div>{`  "Principal": { "AWS": "arn:aws:iam::ACCT_A:root" },`}</div>
                  <div>{`  "Action": "sts:AssumeRole" }`}</div>
                </div>
              </Bubble>
              <Bubble who="mentor">
                That's the trust side, correct. Now show me the permissions policy attached to the same role — that's the half that lets it actually touch S3.
              </Bubble>
              <Bubble who="user">
                ohhh. I attached it to my user, not the role. that's the bug.
              </Bubble>
              <Bubble who="mentor">
                There it is. Move the policy onto the role and you should stop seeing AccessDenied. Try it and ping the result.
              </Bubble>
            </>
          )}
        </div>
      </div>

      {isPast ? (
        <div className="ro-overlay">archived · input disabled · open a new session to continue this thread</div>
      ) : (
        <div className="chat-input">
          <div className="chat-input-box">
            <div className="ph">Reply to mentor…</div>
            <div className="tools">
              <div className="icon-btn">+</div>
              <div className="icon-btn">{`</>`}</div>
              <div className="icon-btn">↑</div>
              <div className="spacer" />
              <span className="tag">mode: topic</span>
              <button className="btn btn-primary" style={{ height: 28, padding: '0 10px' }}>Send →</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

const ChatScreen = () => {

  return (
    <>

const Screen4 = () => (

    <EmailCard
      kind="inactivity"

    <EmailCard
      kind="pace-deviation"
      tag={{ cls: 'info', label: 'Pace deviation' }}
      subject="You're solving 30% fewer DSA problems this week"

    >

const EvalPanel = () => (

          <span className="dots">
            <span className="d done" />

            <span className="d" />
            <span className="d" />
          </span>
        </span>
        <span className="pill active"><span className="ind" /> 1 / 1 correct</span>
      </div>
    </div>

    <div className="chat-body">
      <div className="chat-inner">
        <Bubble who="mentor">
          Let's evaluate graphs. I'll go from recall to depth — answer as fully as you can. I'll grade each one and adjust difficulty as we go.
        </Bubble>
        <Bubble who="mentor">
          <div style={{ marginBottom: 4, fontFamily: "'JetBrains Mono', monospace", fontSize: 10, color: 'var(--muted)', letterSpacing: '0.08em', textTransform: 'uppercase' }}>Q1 · recall</div>
          Walk me through how BFS works on an unweighted graph.
        </Bubble>
        <Bubble who="user">
          Use a queue. Push the start, mark visited. Pop, expand all neighbors not yet visited, push them on, mark them. Repeat until empty. Tracks shortest unweighted distance because each layer is one edge deeper.
        </Bubble>

        <div className="verdict-card">
          <div className="top">
            <span className="verdict-tag strong">✓ Strong</span>
            <span className="lvl">Q1 · recall</span>
          </div>
          <div className="fb">Crisp. You named the invariant (one edge per layer) which is the part most people skip. Going one level deeper.</div>
        </div>

        <Bubble who="mentor">
          <div style={{ marginBottom: 4, fontFamily: "'JetBrains Mono', monospace", fontSize: 10, color: 'var(--muted)', letterSpacing: '0.08em', textTransform: 'uppercase' }}>Q2 · application</div>
          Now: you have a grid with walls and one portal that teleports from A to B at zero cost. Does plain BFS still find shortest path? If not, what breaks and what's the smallest fix?
        </Bubble>
        <Bubble who="user">
          hmm... I think BFS still works because the portal is still cost 0 so it's like another edge. just add A's neighbors to include B.
        </Bubble>

        <div className="verdict-card">
          <div className="top">
            <span className="verdict-tag partial">△ Partial</span>
            <span className="lvl">Q2 · application</span>
          </div>
          <div className="fb">Right instinct — but "cost 0" matters. Plain BFS assumes uniform edge weight. With a zero-cost edge, you need 0-1 BFS (deque) or you'll overcount layers. Worth a session on this. Moving to Q3 anyway.</div>
        </div>
      </div>
    </div>

    <div className="chat-input">
      <div className="eval-input-label"><span className="dot" /> Evaluation mode — your answer is graded</div>
      <div className="chat-input-box">
        <div className="ph">Type your answer to Q3…</div>
        <div className="tools">
          <div className="icon-btn">+</div>
          <div className="icon-btn">{`</>`}</div>
          <div className="spacer" />
          <span className="tag">mode: evaluation</span>
          <button className="btn btn-primary" style={{ height: 28, padding: '0 12px' }}>Submit Answer</button>
        </div>
      </div>
    </div>
  </div>
);
