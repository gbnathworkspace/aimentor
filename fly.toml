app = "mentorman"
primary_region = "sin"  # bom is closed to new machines; sin is nearest to Atlas ap-south-1

[build]
  dockerfile = "unified-backend/Dockerfile"

[env]
  FRONTEND_URL = "https://mentorman.co.in"
  OAUTH_REDIRECT_URI = "https://mentorman.co.in/api/auth/oauth/callback"
  STORAGE_BACKEND = "s3"
  S3_BUCKET_NAME = "mentorman-uploads-prod"
  S3_REGION = "ap-south-1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
